[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-indicator"
version = "0.1.0b1"
description = "Local Linux desktop indicator for AI usage and system activity"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6.0", "requests>=2.31.0"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-subtests>=0.14"]

[project.scripts]
claude-indicator = "indicator_cli:main"

[project.urls]
Repository = "https://github.com/samuelfrench/claude-indicator"
Issues = "https://github.com/samuelfrench/claude-indicator/issues"

[tool.setuptools]
py-modules = [
  "indicator_cli", "claude_widget", "smart_todos", "smart_todo_workflow",
  "terminal_recovery", "terminal_recovery_ui", "widget_runtime", "cursor_usage",
]
