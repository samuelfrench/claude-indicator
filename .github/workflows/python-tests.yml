name: Python tests and beta install

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/todo/**'
      - 'scripts/todo/**'
      - 'TODO.md'
      - 'TODO-archive.md'
  pull_request:
    paths-ignore:
      - 'docs/todo/**'
      - 'scripts/todo/**'
      - 'TODO.md'
      - 'TODO-archive.md'

permissions:
  contents: read

jobs:
  test-and-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Qt EGL runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1
      - name: Install test dependencies
        run: python -m pip install '.[test]'
      - name: Run offline unit tests with isolated user state
        shell: bash
        run: |
          test_home="$(mktemp -d)"
          mkdir -p "$test_home/runtime"
          chmod 700 "$test_home/runtime"
          env -u ANTHROPIC_API_KEY -u CLAUDE_CODE_OAUTH_TOKEN -u GH_TOKEN -u GITHUB_TOKEN \
            HOME="$test_home" XDG_CONFIG_HOME="$test_home/.config" XDG_DATA_HOME="$test_home/.local/share" \
            XDG_STATE_HOME="$test_home/.local/state" XDG_CACHE_HOME="$test_home/.cache" \
            XDG_RUNTIME_DIR="$test_home/runtime" CODEX_HOME="$test_home/.codex" GROK_HOME="$test_home/.grok" \
            QT_QPA_PLATFORM=offscreen python -m pytest -q
      - name: Verify a fresh package install and inert Qt render
        run: python scripts/verify_install.py --report install-validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: beta-install-evidence
          path: install-validation.json
